<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GR Store - Payment</title>
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f9f9f9;">

    <div style="max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1);">
        <h2>GR Store கட்டணம்</h2>
        <p>கதை புத்தகத்தைப் படிக்க ₹1 செலுத்தவும்.</p>

        <!-- Payment Button -->
        <button id="pay-btn" style="background:#28a745; color:white; padding:12px 25px; border:none; border-radius:5px; font-size:18px; cursor:pointer; width: 100%;">
            Pay ₹1Now
        </button>
    </div>

    <script>
    document.getElementById('pay-btn').onclick = function(e){
        var options = {
            "key": "rzp_live_TWfUTNr5dsOOd2", // உங்களது லைவ் கீ ஐடி
            "amount": "100", // ₹20 என்பது 2000 பைசாவாக கணக்கிடப்பட்டுள்ளது
            "currency": "INR",
            "name": "GR Store",
            "description": "Story Reading Access",
            "handler": function (response){
                // பணம் வெற்றிகரமாக முடிந்ததும் இயங்கும் பகுதி
                alert("Payment Successful! ID: " + response.razorpay_payment_id);
                
                // பணம் செலுத்தியதும் mainpage.html பக்கத்திற்கு செல்வது
                window.location.href = "mainpage.html"; 
            },
            "prefill": {
                "name": "Govindaraj",
                "email": "govindraj8@gmail.com",
                "contact": "9999999999"
            },
            "theme": {
                "color": "#3399cc"
            }
        };
        var rzp1 = new Razorpay(options);
        rzp1.open();
        e.preventDefault();
    }
    </script>

</body>
</html>
